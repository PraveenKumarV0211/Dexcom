spring.application.name=Dexcom
server.port=${APPLICATION_PORT:8999}
spring.data.mongodb.uri=${DB_HOST}
spring.data.mongodb.auto-index-creation=true
gemini.api.key=${GEMINI_KEY:placeholder}
huggingface.api.token=${HF_TOKEN}
grok.api.token=${GROK_TOKEN}
claude.api.key=${CLAUDE_API_KEY}
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=glucolens-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
dexcom.client-id=${DEXCOM_CLIENT_ID:placeholder}
dexcom.client-secret=${DEXCOM_CLIENT_SECRET:placeholder}
dexcom.redirect-uri=${DEXCOM_REDIRECT_URL:http://localhost:8999/api/dexcom/callback}
dexcom.base-url=https://api.dexcom.com
spring.elasticsearch.uris=http://localhost:9200
aws.sns.topic-arn=${SNS_TOPIC_ARN:placeholder}
aws.region=us-east-2